name: CI/CD - Agent Build and Deploy to Dev

on:
  push:
    branches: [ main ]

jobs:
  # -----------------
  # CI: Build & Evaluate
  # -----------------
  build-and-evaluate:
    runs-on: ubuntu-latest
    env:
      # Azure / OpenAI environment variables
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
      AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: ${{ secrets.AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED }}
      AZURE_SDK_TRACING_IMPLEMENTATION: ${{ secrets.AZURE_SDK_TRACING_IMPLEMENTATION }}
      # Optional Postgres/checkpointer env vars
      PG_VECTOR_HOST: ${{ secrets.PG_VECTOR_HOST }}
      PG_VECTOR_USER: ${{ secrets.PG_VECTOR_USER }}
      PG_VECTOR_PASSWORD: ${{ secrets.PG_VECTOR_PASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chinook-backend ./backend

      - name: Run Docker container
        run: |
          docker run -d --name chinook-backend -p 80:80 \
            --env "AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}" \
            --env "AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}" \
            --env "AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}" \
            --env "AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}" \
            --env "APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}" \
            --env "AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED=${AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED}" \
            --env "AZURE_SDK_TRACING_IMPLEMENTATION=${AZURE_SDK_TRACING_IMPLEMENTATION}" \
            --env "PG_VECTOR_HOST=${PG_VECTOR_HOST}" \
            --env "PG_VECTOR_USER=${PG_VECTOR_USER}" \
            --env "PG_VECTOR_PASSWORD=${PG_VECTOR_PASSWORD}" \
            --env "PGDATABASE=${PGDATABASE}" \
            chinook-backend:latest

      - name: Wait for container to be ready
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:80/health || curl -s http://localhost:80/docs; then
              echo "Backend is up!"
              break
            fi
            echo "Waiting for backend..."
            sleep 5
          done

      - name: Run evaluations
        run: docker exec -w /app/evaluations chinook-backend python evaluation.py

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: backend/evaluations/data/evaluation_output.json

      - name: Cleanup
        if: always()
        run: |
          docker stop chinook-backend 2>/dev/null || true
          docker rm chinook-backend 2>/dev/null || true

  # -----------------
  # CD: Deploy to Azure Kubernetes Service (AKS)
  # -----------------
  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-evaluate   # wait for CI to pass
    permissions:
      id-token: write   # required for OIDC
      contents: read    # required for actions/checkout
    steps:
      - uses: actions/checkout@v4

      # Login to Azure
      - name: Azure login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Register Microsoft.ContainerService namespace (idempotent)
      - name: Register Microsoft.ContainerService namespace
        run: |
          az provider register --namespace Microsoft.ContainerService

      # Create AKS cluster if it does not exist
      - name: Create AKS cluster if not exists
        run: |
          if ! az aks show --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} &>/dev/null; then
            az aks create \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --name ${{ secrets.AKS_CLUSTER_NAME }} \
              --node-count 1 \
              --enable-addons monitoring \
              --generate-ssh-keys
          else
            echo "AKS cluster already exists."
          fi

      # Login to ACR using access token
      - name: Docker Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }} --expose-token --output tsv --query accessToken > acr_token.txt
          docker login ${{ secrets.ACR_NAME }}.azurecr.io --username 00000000-0000-0000-0000-000000000000 --password $(cat acr_token.txt)

      # Build, Tag, and Push Docker image
      - name: Build and Push Docker image to ACR
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/chinook-backend:latest ./backend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/chinook-backend:latest

      # Get AKS credentials
      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing
      
        # Create namespace if not exists
      - name: Create chinook namespace
        run: |
          kubectl get namespace chinook || kubectl create namespace chinook

      # Create ACR secret in AKS
      - name: Create ACR secret in AKS
        run: |
          kubectl delete secret acr-secret --namespace chinook --ignore-not-found
          kubectl create secret docker-registry acr-secret \
            --namespace chinook \
            --docker-server=${{ secrets.ACR_NAME }}.azurecr.io \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} 

      # Deploy backend to AKS
      - name: Deploy backend to AKS
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: chinook-backend
            namespace: chinook
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: chinook-backend
            template:
              metadata:
                labels:
                  app: chinook-backend
              spec:
                containers:
                - name: chinook-backend
                  image: ${{ secrets.ACR_NAME }}.azurecr.io/chinook-backend:latest
                  ports:
                  - containerPort: 80
                  resources:
                    limits:
                      memory: "256Mi"
                      cpu: "250m"
                    requests:
                      memory: "128Mi"
                      cpu: "125m"
                  env:
                  - name: AZURE_OPENAI_DEPLOYMENT_NAME
                    value: "${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}"
                  - name: AZURE_OPENAI_API_KEY
                    value: "${{ secrets.AZURE_OPENAI_API_KEY }}"
                  - name: AZURE_OPENAI_ENDPOINT
                    value: "${{ secrets.AZURE_OPENAI_ENDPOINT }}"
                  - name: AZURE_OPENAI_API_VERSION
                    value: "${{ secrets.AZURE_OPENAI_API_VERSION }}"
                  - name: APPLICATIONINSIGHTS_CONNECTION_STRING
                    value: "${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}"
                  - name: AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED
                    value: "${{ secrets.AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED }}"
                  - name: AZURE_SDK_TRACING_IMPLEMENTATION
                    value: "${{ secrets.AZURE_SDK_TRACING_IMPLEMENTATION }}"
                  - name: PG_VECTOR_HOST
                    value: "${{ secrets.PG_VECTOR_HOST }}"
                  - name: PG_VECTOR_USER
                    value: "${{ secrets.PG_VECTOR_USER }}"
                  - name: PGPORT
                    value: "${{ secrets.PGPORT }}"
                  - name: PGDATABASE
                    value: "${{ secrets.PGDATABASE }}"
                  - name: PG_VECTOR_PASSWORD
                    value: "${{ secrets.PG_VECTOR_PASSWORD }}"
                imagePullSecrets:
                - name: acr-secret
          EOF

      # Expose backend service
      - name: Expose backend service
        run: |
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: chinook-backend-service
            namespace: chinook
          spec:
            type: LoadBalancer
            selector:
              app: chinook-backend
            ports:
              - protocol: TCP
                port: 80
                targetPort: 80
          EOF

      # Wait for external IP
      - name: Wait for backend service external IP
        id: get_backend_ip
        run: |
          for i in {1..20}; do
            EXTERNAL_IP=$(kubectl get svc chinook-backend-service -n chinook -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$EXTERNAL_IP" ]; then
              echo "EXTERNAL_IP=$EXTERNAL_IP" >> $GITHUB_OUTPUT
              break
            fi
            echo "Waiting for external IP..."
            sleep 15
          done
          if [ -z "$EXTERNAL_IP" ]; then
            echo "Failed to get external IP for backend service"
            exit 1
          fi

      # (Optional) Deploy frontend to AKS (if needed)
      # - name: Deploy frontend to AKS
      #   run: |
      #     cat <<EOF | kubectl apply -f -
      #     apiVersion: apps/v1
      #     kind: Deployment
      #     metadata:
      #       name: chinook-frontend
      #       namespace: chinook
      #     spec:
      #       replicas: 1
      #       selector:
      #         matchLabels:
      #           app: chinook-frontend
      #       template:
      #         metadata:
      #           labels:
      #             app: chinook-frontend
      #         spec:
      #           containers:
      #           - name: chinook-frontend
      #             image: ${{ secrets.ACR_NAME }}.azurecr.io/chinook-frontend:latest
      #             ports:
      #             - containerPort: 80
      #             resources:
      #               limits:
      #                 memory: "512Mi"
      #                 cpu: "500m"
      #               requests:
      #                 memory: "128Mi"
      #                 cpu: "125m"
      #             env:
      #             - name: REACT_APP_API_URL
      #               value: "http://${{ steps.get_backend_ip.outputs.EXTERNAL_IP }}"
      #           imagePullSecrets:
      #           - name: acr-secret
      #     EOF

      # (Optional) Expose frontend service (if needed)
      # - name: Expose frontend service
      #   run: |
      #     kubectl apply -f - <<EOF
      #     apiVersion: v1
      #     kind: Service
      #     metadata:
      #       name: chinook-frontend-service
      #       namespace: chinook
      #     spec:
      #       type: LoadBalancer
      #       selector:
      #         app: chinook-frontend
      #       ports:
      #         - protocol: TCP
      #           port: 80
      #           targetPort: 80
      #     EOF

      - name: Show backend service external IP
        run: |
          echo "Backend service external IP: ${{ steps.get_backend_ip.outputs.EXTERNAL_IP }}"
